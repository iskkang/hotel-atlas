name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          for f in index.html tiers/index.html promotions/index.html cards/index.html map/index.html; do test -s "$f"; done
          test -s styles.css
          test -s netlify.toml
          test -s data/brands.js
      - name: Check JavaScript syntax
        run: |
          for f in js/*.js data/brands.js data/edition-ae.js data/regions.js; do node --check "$f"; done
      - name: Check hotel data files
        run: |
          python3 -c "import json; [json.load(open(p)) for p in ('data/hotels.json','data/hotels_atp.json')]"
          python3 -m py_compile scripts/import_atp.py
