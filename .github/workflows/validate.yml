name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s netlify.toml
          test -s data/brands.js
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data/brands.js
      - name: Check hotel data files
        run: |
          python3 -c "import json; [json.load(open(p)) for p in ('data/hotels.json','data/hotels_atp.json')]"
          python3 -m py_compile scripts/import_atp.py
