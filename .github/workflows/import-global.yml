name: Import global hotel extracts
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to import (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - europe
          - asia
          - americas
          - africa-oceania
  schedule:
    - cron: '15 2 * * 1'
permissions:
  contents: write
concurrency:
  group: global-osm-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium==4.0.2
      - name: Import selected country extracts
        env:
          REGION: ${{ inputs.region || 'all' }}
        run: python scripts/import_global.py --region "$REGION"
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotels.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh global OSM hotel catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
