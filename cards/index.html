<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UAE hotel cards · Hotel Atlas</title>
<meta name="description" content="Credit cards issued in the UAE that earn hotel points or come with elite status: annual fees, salary minimums, status and current offers.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/styles.css">
</head>

<main class="wrap page">

      <p class="eyebrow">UAE hotel credit cards</p>
      <h1>Cards that earn hotel status</h1>

      <tbody id="glanceBody"></tbody>
    </table>
  </div>
  <p class="note" id="cardsNote"></p>

  <div id="byProgram"></div>

  <section class="sources">
    <h2 class="sub">Sources</h2>
    <ul id="sourceList"></ul>

<footer id="siteFooter"></footer>
