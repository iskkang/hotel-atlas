[build]
  publish = "."
  command = "echo 'Static Hotel Atlas site ready'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
